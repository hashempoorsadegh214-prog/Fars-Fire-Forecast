name: Automatic GEOS-5 FWI
on:
  schedule:
    - cron: '23 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional YYYY-MM-DD; blank = tomorrow in Tehran'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: geos5-publish
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests numpy netCDF4 rasterio geopandas shapely pyproj
      - name: Download exact forecast and build validated raster
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          test -s fars.geojson
          python scripts/download_geos5_fwi.py
          python scripts/clip_geos5_fwi.py
      - name: Commit only published data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/processed/fwi/
          if ! git diff --cached --quiet; then
            git commit -m 'Update GEOS-5 forecast and metadata'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website without raw NetCDF
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/scripts _site/data/raw
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
